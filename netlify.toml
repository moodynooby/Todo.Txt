[build]
  command = "pnpm install --frozen-lockfile && pnpm run build:kmp"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"
  JAVA_VERSION = "21"

# The hosted web app is the active Compose Multiplatform/Kotlin/Wasm build.
# Build strictly with pnpm because the repository uses a pnpm lockfile.

# SPA: every path falls back to index.html (the app has no URL-based router,
# but the service worker / PWA share target hits `/`, so keep it explicit).
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Long-lived cache for generated Wasm and hashed static assets; the rest gets a short TTL.
[[headers]]
  for = "/*.wasm"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
    Content-Type = "application/wasm"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Pre-compressed service worker and manifest speed up first load.
[build.processing]
  skip_processing = false

[build.processing.css]
  bundle = false
  minify = false

[build.processing.js]
  bundle = false
  minify = false

[build.processing.html]
  pretty_urls = true
