kotlin.code.style=official
android.useAndroidX=true
# Local: daemon + parallel + build cache = fast incremental builds (3g heap for Wasm).
# CI overrides via GRADLE_OPTS in .github/workflows/*.yml (2g, workers=2, no daemon).
org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8 -XX:+UseG1GC
kotlin.daemon.jvmargs=-Xmx3g
org.gradle.workers.max=4
org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.parallel=true
# Keep the native daemon on the required JDK 21. CI and local hosts expose
# their installed JDK through JAVA_HOME; Gradle also auto-detects toolchains.
org.gradle.java.installations.fromEnv=JAVA_HOME
org.gradle.java.installations.auto-detect=true
# This module is a Kotlin Multiplatform application; AGP 9.x otherwise rejects
# the com.android.application + Kotlin Multiplatform combination before compilation.
android.builtInKotlin=false
android.newDsl=false
