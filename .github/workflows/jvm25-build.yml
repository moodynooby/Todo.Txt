name: JVM 25 Build Test

on:
  push:
    branches: [ main, fix/android-tauri-build ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, armv7-linux-androideabi, i686-linux-android, x86_64-linux-android

      - name: Setup Java 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'oracle' # Or 'temurin' if available, but Oracle usually has early access

      - name: Install dependencies
        run: pnpm install

      - name: Install Android SDK Components
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platforms;android-35" "platforms;android-36" "build-tools;35.0.0" "build-tools;36.0.0" "ndk;30.0.15729638"

      - name: Set Environment Variables
        run: |
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
          echo "NDK_HOME=$ANDROID_SDK_ROOT/ndk/30.0.15729638" >> $GITHUB_ENV

      - name: Verify Gradle Configuration
        working-directory: src-tauri/gen/android
        run: ./gradlew help --no-daemon

      - name: Run Android Build (Configuration Only)
        working-directory: src-tauri/gen/android
        run: ./gradlew :app:assembleDebug --dry-run --no-daemon

      - name: Build Desktop (AppImage)
        run: pnpm tauri build --bundles appimage
