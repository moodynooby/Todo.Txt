# Tauri release builds for Todo.Txt.
#
# Triggers on a pushed git tag matching `v*` (e.g. `v1.0.1`) and creates a
# GitHub Release with all installers attached:
#
# - Windows:   .exe installer, .msi, .zip
# - Linux:     .deb (Ubuntu/Debian), .rpm (Fedora), .AppImage (any distro)
# - Android:   .apk (universal, universalApk) and .aab (Play Store)
#
# For every push to the branch the same workflow also runs a quick check job
# (lint + typecheck + desktop build on Ubuntu) so broken native code is caught
# in CI before it reaches a release.

name: Tauri Builds

on:
  push:
    tags:
      - "v*"
    branches:
      - main
      - tauri-native-shell
  pull_request:
    branches:
      - main
      - tauri-native-shell

env:
  # Make sure pnpm (not npm) is used in the actions that run our scripts.
  PNPM_VERSION: 9
  RUST_BACKTRACE: 1

jobs:
  # ── Fast feedback: check + typecheck + desktop build on Ubuntu ──────────
  check:
    runs-on: ubuntu-22.04
    if: ${{ github.event_name != 'push' || !startsWith(github.ref, 'refs/tags/') }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - run: pnpm install
      - run: pnpm check
      - run: pnpm tauri build
        env:
          CI: true

  # ── Desktop: Windows / Linux / macOS ────────────────────────────────────
  build-desktop:
    if: startsWith(github.ref, 'refs/tags/')
    needs: check
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "ubuntu-22.04"
            rust-targets: "x86_64-unknown-linux-gnu"
            args: "--bundles deb,rpm,appimage"
          - platform: "windows-latest"
            rust-targets: "x86_64-pc-windows-msvc"
            args: "--bundles nsis,msi"
          - platform: "macos-latest"
            rust-targets: "x86_64-apple-darwin,aarch64-apple-darwin"
            args: "--bundles dmg,updater"
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      - name: Install Tauri dependencies (Linux)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install Apple certificates (macOS)
        if: matrix.platform == 'macos-latest'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          if [ -n "$APPLE_CERTIFICATE" ]; then
            echo "$APPLE_CERTIFICATE" | base64 -d | security import /dev/stdin -P "$APPLE_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k ~/Library/Keychains/login.keychain
            security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" ~/Library/Keychains/login.keychain
          fi
        continue-on-error: true

      - run: pnpm install
      - run: pnpm tauri build ${{ matrix.args }}

      - name: Upload desktop artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tauri-desktop-${{ matrix.platform }}
          path: |
            src-tauri/target/release/bundle/**/*Todo.Txt*
            src-tauri/target/release/bundle/**/*TodoTxt*

  # ── Android: APK (release) + AAB (Play Store) ──────────────────────────
  build-android:
    if: startsWith(github.ref, 'refs/tags/')
    needs: check
    permissions:
      contents: write
    runs-on: ubuntu-22.04
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - uses: pnpm/action-setup@v4
        with:
          version: 9
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: "aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android"

      - name: Install Android NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r26
          add-to-path: false

      - name: Install Tauri system dependencies (Linux needs webkit2gtk)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - run: pnpm install

      # The release keystore is decoded from the signed-upload secret so CI
      # can produce Play Store-ready artifacts. Without it the build still
      # produces a debug-signed APK via `android build` (fallback handled in
      # the gradle step below).
      - name: Prepare release keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > src-tauri/gen/android/app/release.keystore
            cat > src-tauri/gen/android/key.properties <<EOF
          storePassword=${KEYSTORE_PASSWORD}
          keyPassword=${KEY_PASSWORD}
          keyAlias=${KEY_ALIAS}
          storeFile=${{ github.workspace }}/src-tauri/gen/android/app/release.keystore
          EOF
            echo "Release keystore configured."
          else
            echo "ANDROID_KEYSTORE_BASE64 secret not set; producing debug-signed APK."
          fi

      - name: Build Android artifacts
        run: |
          export ANDROID_NDK_HOME="${{ steps.setup-ndk.outputs.ndk-path }}"
          pnpm tauri android build --apk
          pnpm tauri android build --aab

      - name: Upload Android artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tauri-android
          path: |
            src-tauri/gen/android/app/build/outputs/**/*-universal*.apk
            src-tauri/gen/android/app/build/outputs/**/*.apk
            src-tauri/gen/android/app/build/outputs/**/*.aab

  # ── Assemble the GitHub Release ────────────────────────────────────────
  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [build-desktop, build-android]
    permissions:
      contents: write
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts/
          merge-multiple: false

      - name: Flatten artifacts for the release
        run: |
          mkdir -p release
          find artifacts -type f \( -name "*Todo.Txt*" -o -name "*TodoTxt*" -o -name "*.apk" -o -name "*.aab" \) -exec cp {} release/ \;
          ls -la release/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release/**/*
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, 'beta') || contains(github.ref_name, 'alpha') || contains(github.ref_name, 'rc') }}
