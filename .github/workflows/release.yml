# Cross-platform release workflow for Todo.Txt.
# Triggered by a tag prefixed with "app-v" (e.g. app-v0.1.0) or "v" (web app).
#
# Jobs:
#   build-windows  — Desktop MSI installer (Windows x64)
#   build-linux    — Desktop .deb installer (Ubuntu x64)
#   build-android  — Universal release APK
#   build-web      — Web app static bundle
#   release        — Collects all artifacts into a GitHub Release
#
# Desktop and Android packaging use JDK 21, matching the native Gradle daemon
# criteria and the current Compose Multiplatform toolchain.
name: Release

on:
  push:
    branches: [main, "native/kotlin-compose"]
    tags:
      - "v*"
      - "app-v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Optional release tag (e.g. app-v0.1.0)"
        required: false
        type: string

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  # ---------------- Desktop — Windows (MSI) ----------------
  build-windows:
    name: Desktop — Windows
    runs-on: windows-latest
    if: startsWith(github.ref_name, 'app-v') || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Package MSI installer
        shell: cmd
        env:
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8 -XX:+UseG1GC -Dorg.gradle.workers.max=2"
        run: |
          cd todo.txt_KWP
          rem setup-java provides the JDK 21 used by the native Gradle build
          for /f "delims=" %%i in ('where java') do set JAVA_BIN=%%i
          call gradlew.bat :app:packageReleaseDistributionForCurrentOS --no-daemon --max-workers=2 --build-cache

      - name: Collect artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path out | Out-Null
          Write-Output (Get-Location)
          Get-ChildItem -Recurse -Path todo.txt_KWP/app/build/compose/binaries -Filter *.msi -ErrorAction SilentlyContinue | ForEach-Object {
            Write-Output "MSI: $($_.FullName)"
            Copy-Item $_.FullName out/
          }
          if ((Get-ChildItem out).Count -eq 0) {
            Write-Output "Available build dirs:"
            Get-ChildItem -Recurse -Directory -Path todo.txt_KWP -Filter build -ErrorAction SilentlyContinue | Select-Object -First 20 | ForEach-Object { Write-Output $_.FullName }
            Write-Error "No MSI found"
            exit 1
          }
          Get-ChildItem out

      - uses: actions/upload-artifact@v4
        with:
          name: todo-txt-windows
          path: out/*.msi
          if-no-files-found: error

  # ---------------- Desktop — Linux (AppImage + deb) ----------------
  build-linux:
    name: Desktop — Linux
    runs-on: ubuntu-latest
    if: startsWith(github.ref_name, 'app-v') || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Package .deb installer
        env:
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8 -XX:+UseG1GC -Dorg.gradle.workers.max=2"
        run: |
          # jpackage needs binutils (objcopy) and fakeroot on Linux
          sudo apt-get install -y binutils fakeroot >/dev/null
          cd todo.txt_KWP
          ./gradlew :app:packageReleaseDistributionForCurrentOS --no-daemon --max-workers=2 --build-cache

      - name: Collect artifacts
        run: |
          mkdir -p out
          cp todo.txt_KWP/app/build/compose/binaries/main-release/deb/*.deb out/ 2>/dev/null || { echo "no deb"; exit 1; }
          ls -la out/

      - uses: actions/upload-artifact@v4
        with:
          name: todo-txt-linux
          path: out/*.deb
          if-no-files-found: error

  # ---------------- Android (APK) ----------------
  build-android:
    name: Android — APK
    runs-on: ubuntu-latest
    if: startsWith(github.ref_name, 'app-v') || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | \
            sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Prepare signing keystore
        run: |
          if [ -n "${{ secrets.BASE64_KEYSTORE }}" ]; then
            echo "${{ secrets.BASE64_KEYSTORE }}" | base64 -d > ~/release-keystore.jks
            echo "KEYSTORE_PATH=$HOME/release-keystore.jks" >> $GITHUB_ENV
            echo "KEYSTORE_PASSWORD=${{ secrets.KEYSTORE_PASSWORD }}" >> $GITHUB_ENV
            echo "KEY_ALIAS=${{ secrets.KEY_ALIAS }}" >> $GITHUB_ENV
            echo "KEY_PASSWORD=${{ secrets.KEY_PASSWORD }}" >> $GITHUB_ENV
          else
            # No user keystore configured: generate a CI-only keystore so the
            # release APK is signed and installable. Do NOT use this for Play
            # Store distribution (replacing the key breaks upgrades).
            echo "todo-ci-pass" | keytool -genkeypair -v \
              -keystore ~/ci-keystore.jks -alias todotxt-ci \
              -keypass todo-ci-pass -storepass todo-ci-pass \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=TodoTxt CI, OU=Dev, O=moodynooby, L=Online, ST=Online, C=US" 2>/dev/null
            echo "KEYSTORE_PATH=$HOME/ci-keystore.jks" >> $GITHUB_ENV
            echo "KEYSTORE_PASSWORD=todo-ci-pass" >> $GITHUB_ENV
            echo "KEY_ALIAS=todotxt-ci" >> $GITHUB_ENV
            echo "KEY_PASSWORD=todo-ci-pass" >> $GITHUB_ENV
          fi

      - name: Validate Firebase release configuration
        env:
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
        run: |
          test -n "$FIREBASE_API_KEY" || { echo "Missing FIREBASE_API_KEY repository secret"; exit 1; }
          test -n "$FIREBASE_PROJECT_ID" || { echo "Missing FIREBASE_PROJECT_ID repository secret"; exit 1; }

      - name: Assemble signed release APK
        env:
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8 -XX:+UseG1GC -Dorg.gradle.workers.max=2"
        run: |
          cd todo.txt_KWP
          ./gradlew :app:assembleRelease --no-daemon --max-workers=2 --build-cache \
            -PfirebaseApiKey="$FIREBASE_API_KEY" \
            -PfirebaseProjectId="$FIREBASE_PROJECT_ID" \
            -Pandroid.injected.signing.store.file=$KEYSTORE_PATH \
            -Pandroid.injected.signing.store.password=$KEYSTORE_PASSWORD \
            -Pandroid.injected.signing.key.alias=$KEY_ALIAS \
            -Pandroid.injected.signing.key.password=$KEY_PASSWORD

      - name: Collect artifacts
        run: |
          mkdir -p out
          cp todo.txt_KWP/app/build/outputs/apk/release/*.apk out/ 2>/dev/null || \
            cp todo.txt_KWP/app/build/outputs/apk/debug/*.apk out/
          ls -la out/ || { echo "no apk"; exit 1; }

      - uses: actions/upload-artifact@v4
        with:
          name: todo-txt-android
          path: out/*.apk
          if-no-files-found: error

  # ---------------- KMP/Wasm web app static bundle ----------------
  build-web:
    name: Web — KMP/Wasm bundle
    runs-on: ubuntu-latest
    if: startsWith(github.ref_name, 'v') || startsWith(github.ref_name, 'app-v') || github.event_name == 'workflow_dispatch'
    env:
      FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
      FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - uses: pnpm/action-setup@v4
        with:
          version: 9
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install Wasm runtime dependency
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libatomic1

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build KMP/Wasm web app
        env:
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8 -XX:+UseG1GC -XX:+UseStringDeduplication -Dkotlin.daemon.jvmargs=-Xmx2g -Dorg.gradle.workers.max=2 -Dorg.gradle.parallel=false"
        run: pnpm run build -- --build-cache --no-daemon --max-workers=2

      - name: Zip distribution
        run: zip -r web-dist.zip dist

      - uses: actions/upload-artifact@v4
        with:
          name: todo-txt-web
          path: web-dist.zip
          if-no-files-found: error

  # ---------------- Assemble GitHub Release ----------------
  release:
    name: Create GitHub Release
    needs: [build-windows, build-linux, build-android, build-web]
    if: always() && needs.build-windows.result == 'success' && needs.build-linux.result == 'success' && needs.build-android.result == 'success' && needs.build-web.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: todo-txt-*
          merge-multiple: true

      - name: List artifacts
        run: ls -laR artifacts/

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          prerelease: ${{ contains(github.ref_name, 'beta') || contains(github.ref_name, 'alpha') || contains(github.ref_name, 'rc') }}
          files: |
            artifacts/*.msi
            artifacts/*.deb
            artifacts/*.apk
            artifacts/web-dist.zip
          fail_on_unmatched_files: false
