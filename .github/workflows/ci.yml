name: Continuous Integration

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    name: Web and KMP validation
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - uses: pnpm/action-setup@v4
        with:
          version: 9
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install Wasm and Android runtime dependencies
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libatomic1

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android API 37 toolchain
        run: yes | sdkmanager "platforms;android-37.0" "build-tools;36.1.0"

      - name: Install active KMP root dependencies
        run: pnpm install --frozen-lockfile

      - name: Build production KMP/Wasm web distribution
        env:
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8 -XX:+UseG1GC -XX:+UseStringDeduplication -Dkotlin.daemon.jvmargs=-Xmx2g -Dorg.gradle.workers.max=2 -Dorg.gradle.parallel=false -Dorg.gradle.configureondemand=true"
        run: pnpm build -- --build-cache --no-daemon --max-workers=2

      - name: Run KMP core tests
        working-directory: todo.txt_KWP
        env:
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8 -XX:+UseG1GC -Dorg.gradle.workers.max=2"
        run: ./gradlew :core:jvmTest --no-daemon --max-workers=2 --build-cache --console=plain

      - name: Compile KMP desktop target
        working-directory: todo.txt_KWP
        env:
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8 -XX:+UseG1GC -Dorg.gradle.workers.max=2"
        run: ./gradlew :app:compileKotlinDesktop --no-daemon --max-workers=2 --build-cache --console=plain

      - name: Compile KMP Wasm target
        working-directory: todo.txt_KWP
        env:
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8 -XX:+UseG1GC -Dorg.gradle.workers.max=2"
        run: ./gradlew :app:compileKotlinWasmJs --no-daemon --max-workers=2 --build-cache --console=plain

      - name: Compile Android target
        working-directory: todo.txt_KWP
        env:
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8 -XX:+UseG1GC -Dorg.gradle.workers.max=2"
        run: ./gradlew :app:compileDebugKotlinAndroid --no-daemon --max-workers=2 --build-cache --console=plain

      - name: Free disk space
        if: always()
        run: |
          rm -rf todo.txt_KWP/.gradle/caches/*/transforms 2>/dev/null || true
          rm -rf ~/.gradle/caches/*/transforms 2>/dev/null || true
          df -h
